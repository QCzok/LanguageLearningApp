version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lingua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lingua
      POSTGRES_PASSWORD: lingua
      POSTGRES_DB: lingua
    ports:
      - '5432:5432'
    volumes:
      - lingua-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lingua -d lingua']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lingua-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - lingua-redisdata:/data

volumes:
  lingua-pgdata:
  lingua-redisdata:
